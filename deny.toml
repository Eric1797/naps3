# cargo-deny policy. Scan logic is ported from NAPS2 (GPL-2.0-or-later),
# so GPL-2.0-or-later is allowed alongside permissive licences.
# Copyleft-incompatible (AGPL, LGPL-linked) code is never linked.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"
