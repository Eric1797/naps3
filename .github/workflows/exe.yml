name: Windows exe

# Release-compile the desktop app + CLI for Windows x64 on every push to
# main (and on demand) and attach the exes as build artifacts.
# Installer (MSI) + portable zip + signing land in M8.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  # Never cancel an in-flight exe build: a cancelled run uploads no artifact.
  group: exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exe:
    name: exe (windows x64 release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p scancraft -p scancraft-cli

      - name: Smoke test (CLI)
        run: .\target\release\scancraft-cli.exe devices

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exe
          path: |
            target/release/*.exe
            target/debug/*.exe
            dist/*.exe
            build/*.exe
          if-no-files-found: warn

  exe-x86:
    # 32-bit build: TWAIN data sources are ~99% 32-bit DLLs, so only this
    # build can load them in-process (same reason NAPS2 ships a WinX86
    # helper). Runs on 64-bit Windows via WOW64.
    name: exe (windows x86 32-bit release, for TWAIN)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: exe-x86

      - name: Build (32-bit)
        run: cargo build --release --target i686-pc-windows-msvc -p scancraft -p scancraft-cli

      - name: Smoke test (CLI)
        run: .\target\i686-pc-windows-msvc\release\scancraft-cli.exe devices

      - name: Upload Windows x86 EXE
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exe-x86
          path: |
            target/i686-pc-windows-msvc/release/*.exe
          if-no-files-found: warn
