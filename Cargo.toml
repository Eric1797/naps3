[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
scancraft-model = { path = "crates/scancraft-model", version = "0.1.0" }
scancraft-scan-core = { path = "crates/scancraft-scan-core", version = "0.1.0" }
scancraft-scan-mock = { path = "crates/scancraft-scan-mock", version = "0.1.0" }
scancraft-engine = { path = "crates/scancraft-engine", version = "0.1.0" }
scancraft-imaging = { path = "crates/scancraft-imaging", version = "0.1.0" }
scancraft-export = { path = "crates/scancraft-export", version = "0.1.0" }
scancraft-ocr = { path = "crates/scancraft-ocr", version = "0.1.0" }
scancraft-profiles = { path = "crates/scancraft-profiles", version = "0.1.0" }
scancraft-scan-wia = { path = "crates/scancraft-scan-wia", version = "0.1.0" }
scancraft-scan-twain = { path = "crates/scancraft-scan-twain", version = "0.1.0" }
scancraft-scan-sane = { path = "crates/scancraft-scan-sane", version = "0.1.0" }
scancraft-scan-escl = { path = "crates/scancraft-scan-escl", version = "0.1.0" }

# Pure-Rust codecs (no C deps): BMP/JPEG/PNG via `image`.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
libloading = "0.8"

# Desktop GUI (same versions as PdfCraft).
egui = "0.36"
eframe = { version = "0.36", default-features = false }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
